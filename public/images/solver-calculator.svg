<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" fill="none" role="img" aria-labelledby="t">
  <title id="t">Solver calculator solving an equation step by step</title>
  <rect x="20" y="20" width="520" height="360" rx="28" fill="#EEF2FF"/>
  <rect x="60" y="56" width="200" height="290" rx="22" fill="#4F46E5"/>
  <rect x="80" y="78" width="160" height="62" rx="12" fill="#FFFFFF"/>
  <text x="228" y="102" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#6B7280">3x + 7 = 22</text>
  <text x="228" y="128" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">x = 5</text>
  <g fill="#6366F1">
    <rect x="80" y="156" width="34" height="34" rx="9"/>
    <rect x="122" y="156" width="34" height="34" rx="9"/>
    <rect x="164" y="156" width="34" height="34" rx="9"/>
    <rect x="80" y="198" width="34" height="34" rx="9"/>
    <rect x="122" y="198" width="34" height="34" rx="9"/>
    <rect x="164" y="198" width="34" height="34" rx="9"/>
    <rect x="80" y="240" width="34" height="34" rx="9"/>
    <rect x="122" y="240" width="34" height="34" rx="9"/>
    <rect x="164" y="240" width="34" height="34" rx="9"/>
    <rect x="80" y="282" width="76" height="34" rx="9"/>
    <rect x="164" y="282" width="34" height="34" rx="9"/>
  </g>
  <rect x="206" y="156" width="34" height="76" rx="9" fill="#A5B4FC"/>
  <rect x="206" y="240" width="34" height="76" rx="9" fill="#FFFFFF"/>
  <text x="223" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4F46E5">=</text>
  <rect x="292" y="70" width="216" height="270" rx="18" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2"/>
  <text x="314" y="106" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4F46E5">Step by step</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#374151">
    <circle cx="322" cy="144" r="11" fill="#E0E7FF"/>
    <text x="322" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">1</text>
    <text x="344" y="149">3x + 7 = 22</text>
    <circle cx="322" cy="192" r="11" fill="#E0E7FF"/>
    <text x="322" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">2</text>
    <text x="344" y="197">3x = 22 − 7 = 15</text>
    <circle cx="322" cy="240" r="11" fill="#E0E7FF"/>
    <text x="322" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#4F46E5">3</text>
    <text x="344" y="245">x = 15 ÷ 3</text>
    <circle cx="322" cy="288" r="11" fill="#4F46E5"/>
    <text x="322" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="344" y="293" font-weight="700" fill="#111827">x = 5</text>
  </g>
</svg>
